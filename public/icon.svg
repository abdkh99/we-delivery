<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2563eb" rx="80"/>
  
  <!-- Shopping cart icon -->
  <g transform="translate(100, 100)">
    <!-- Cart body -->
    <path d="M 80 80 L 60 200 L 280 200 L 300 80 Z" fill="white" opacity="0.9"/>
    
    <!-- Cart handle -->
    <path d="M 40 80 L 80 80" stroke="white" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Wheels -->
    <circle cx="120" cy="260" r="24" fill="white" opacity="0.9"/>
    <circle cx="240" cy="260" r="24" fill="white" opacity="0.9"/>
    
    <!-- Items in cart -->
    <rect x="120" y="100" width="40" height="60" fill="#60a5fa" rx="8"/>
    <rect x="180" y="120" width="40" height="40" fill="#60a5fa" rx="8"/>
    <rect x="240" y="110" width="30" height="50" fill="#60a5fa" rx="8"/>
  </g>
</svg>
